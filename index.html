<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 할 일</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f0;color:#24372f;font-family:system-ui,-apple-system,sans-serif;padding:56px 20px}main{max-width:680px;margin:auto}.eyebrow{font-size:13px;letter-spacing:.12em;color:#62766b}h1{font-size:40px;letter-spacing:-2px;margin:12px 0}p{line-height:1.7;color:#65756d}.card{margin-top:30px;background:white;border:1px solid #dce3da;border-radius:24px;padding:26px;box-shadow:0 12px 40px #24372f08}form{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;border:1px solid #cbd5cc;border-radius:12px;padding:15px;font:inherit}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 17px;background:#285b45;color:white}button:focus-visible,input:focus-visible{outline:3px solid #d3a54b;outline-offset:3px}nav{display:flex;gap:8px;margin:24px 0 10px;flex-wrap:wrap}nav button{background:#f0f3ed;color:#526457;padding:9px 14px}nav button[aria-pressed=true]{background:#285b45;color:white}ul{padding:0;list-style:none}li{display:flex;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid #edf0e9}li label{display:flex;gap:12px;align-items:center;flex:1;min-width:0}li span{overflow-wrap:anywhere}input[type=checkbox]{width:21px;height:21px;accent-color:#285b45;flex-shrink:0}.done{text-decoration:line-through;color:#8b968e}.delete{background:transparent;color:#86665d;padding:8px}.status{font-size:14px;min-height:24px}.empty{text-align:center;padding:32px 0;color:#829084}.foot{font-size:13px;margin-top:22px}@media(max-width:480px){body{padding:28px 16px}.card{padding:18px}h1{font-size:34px}form button{padding:12px}}
</style></head>
<body><main><div class="eyebrow">MY SMALL WORKSPACE</div><h1>나의 할 일</h1><p>하나씩 적고, 하나씩 마무리하세요.</p><section class="card" aria-label="할 일 관리">
<form id="form"><input id="task" type="text" aria-label="새 할 일" placeholder="어떤 일을 할까요?" maxlength="200" required autocomplete="off"><button type="submit">추가</button></form>
<nav aria-label="할 일 필터"><button type="button" data-filter="all" aria-pressed="true">전체</button><button type="button" data-filter="active" aria-pressed="false">진행 중</button><button type="button" data-filter="done" aria-pressed="false">완료</button></nav>
<p id="count" class="status" aria-live="polite"></p><ul id="list"></ul><p id="empty" class="empty">첫 번째 할 일을 추가해 보세요.</p><p id="notice" class="status" role="status"></p>
</section><p class="foot">할 일은 이 브라우저에 저장됩니다. 다른 기기와 동기화되지 않으며,<br>브라우저 데이터를 지우면 기록도 삭제될 수 있습니다.</p></main>
<script>
'use strict';
const key='folder-tasks-v1'; let tasks=[],filter='all';
const list=document.getElementById('list'),input=document.getElementById('task'),notice=document.getElementById('notice');
try{const stored=JSON.parse(localStorage.getItem(key)||'[]'); if(Array.isArray(stored))tasks=stored.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean');}catch{notice.textContent='저장된 기록을 불러오지 못했습니다. 새로 입력한 내용은 현재 화면에서 사용할 수 있습니다.';}
function save(){try{localStorage.setItem(key,JSON.stringify(tasks));notice.textContent='';}catch{notice.textContent='브라우저에 저장하지 못했습니다. 이 화면을 닫으면 변경 내용이 사라질 수 있습니다.';}}
function render(){
 list.replaceChildren();
 const shown=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));
 for(const t of shown){
 const li=document.createElement('li'),label=document.createElement('label'),check=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');
 check.type='checkbox';check.checked=t.done;span.textContent=t.text;span.className=t.done?'done':'';
 check.addEventListener('change',()=>{t.done=check.checked;save();render();});
 del.type='button';del.textContent='삭제';del.className='delete';del.setAttribute('aria-label',t.text+' 삭제');
 del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render();});
 label.append(check,span);li.append(label,del);list.append(li);
 }
 document.getElementById('count').textContent='전체 '+tasks.length+'개 · 남은 할 일 '+tasks.filter(t=>!t.done).length+'개';
 const empty=document.getElementById('empty');empty.hidden=shown.length>0;empty.textContent=tasks.length?'이 목록에 표시할 할 일이 없습니다.':'첫 번째 할 일을 추가해 보세요.';
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value){input.value='';input.focus();return;}tasks.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),text:value,done:false});input.value='';save();render();input.focus();});
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
render();
</script></body></html>
